<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>TRANSFORM / TRANSLATE</h1>

    <div class="container">
        <div class="box-section">
            <p>Before</p>
            <div class="box" id="before">BOX</div>
        </div>

        <div class="box-section">
            <p>After</p>
            <div class="box" id="after">BOX</div>
        </div>
    </div>

    <div class="buttons">
        <button onclick="setTransform('translate')">Translate</button>
        <button onclick="setTransform('rotate')">Rotate</button>
        <button onclick="setTransform('scale')">Scale</button>
        <button onclick="setTransform('skew')">Skew</button>
    </div>

    <script>
        function setTransform(type) {
            const afterBox = document.getElementById("after");

            
            afterBox.classList.remove("translate", "rotate", "scale", "skew");

            
            afterBox.classList.add(type);

            
            document.querySelector("h1").textContent = "TRANSFORM : " + type.toUpperCase();
        }

        
        setTransform('translate');
    </script>

</body>
</html>
